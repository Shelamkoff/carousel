name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests, typecheck and package build
        run: npm run check

      - name: Verify committed distribution
        run: git diff --exit-code -- dist demo-assets

      - name: Configure Chromium
        if: matrix.node == '24'
        run: |
          carousel_chrome=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$carousel_chrome" ]; then
            "$carousel_chrome" --version
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$carousel_chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Browser integration tests
        if: matrix.node == '24'
        run: npm run test:browser
